spring.application.name=URLShortenerService

# Server Configuration (port is set by the platform/host automatically)
# server.port=8081

# Database Configuration
# Override these via environment variables on Render/cloud platforms
# Defaults work for local MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/urlshortener}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.format_sql=true
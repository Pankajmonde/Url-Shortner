services:
- type: web
  name: url-shortener
  runtime: docker
  plan: free
  dockerfilePath: ./Dockerfile
  healthCheckPath: /
  envVars:
  - key: DB_URL
    sync: false
  - key: DB_USERNAME
    sync: false
  - key: DB_PASSWORD
    sync: false
  - key: DB_DRIVER
    value: org.postgresql.Driver
  - key: DB_DIALECT
    value: org.hibernate.dialect.PostgreSQLDialect
